- id: lwbgt
  name: lwbgt
  description: >-
    Outdoor wet-bulb globe temperature (WBGT) calculations based on the original Argonne Liljegren model, available as Python, R, and Julia packages.
    All three share a versioned C library with reference-compatible v1 calculations, plus C/FFI and SwiftPM interfaces.
  role: Author and maintainer of the package and its interfaces around the original calculation.
  relationships: [author, maintainer]
  programming_languages: [Python, R, C, Julia, Swift]
  keywords: [wet-bulb globe temperature, WBGT, Liljegren model, Argonne Liljegren, meteorological inputs]
  links:
    - label: GitHub
      kind: repository
      url: https://github.com/zyf0717/lwbgt
    - label: PyPI
      kind: registry
      url: https://pypi.org/project/lwbgt/
    - label: CRAN
      kind: registry
      url: https://cran.r-project.org/package=lwbgt
    - label: JuliaHub
      kind: registry
      url: https://platform.juliahub.com/ui/Packages/General/LWBGT

- id: heatstressr
  name: HeatStressR
  description: >-
    An R package for heat-stress metrics, including Liljegren wet-bulb globe temperature (WBGT), Romps wet-bulb temperature, the Lu heat index, and humidex.
    It supports batch calculations, diagnostics, and optional parallel execution for Liljegren WBGT.
  role: Creator and maintainer of the independent HeatStress fork.
  relationships: [author, maintainer]
  programming_languages: [R]
  keywords: [heat stress, wet-bulb globe temperature, WBGT, Liljegren model, thermodynamic wet-bulb temperature, Romps wet bulb, Lu heat index, heat index, humidex, psychrometrics]
  links:
    - label: GitHub
      kind: repository
      url: https://github.com/zyf0717/HeatStressR
    - label: CRAN
      kind: registry
      url: https://cran.r-project.org/package=HeatStressR

- id: heatstressjl
  name: HeatStress.jl
  description: >-
    A dedicated Julia package for heat-stress models, including Liljegren wet-bulb globe temperature (WBGT), heat index, humidex, and wet-bulb temperature, with diagnostics and batch or threaded calculations.
  role: Author and maintainer.
  relationships: [author, maintainer]
  programming_languages: [Julia]
  keywords: [heat stress, wet-bulb globe temperature, WBGT, Liljegren model, RCC estimated WBGT, heat index, humidex, wet-bulb temperature]
  links:
    - label: GitHub
      kind: repository
      url: https://github.com/zyf0717/HeatStress.jl
    - label: JuliaHub
      kind: registry
      url: https://platform.juliahub.com/ui/Packages/General/HeatStress

- id: polar-ble-tools
  name: polar-ble-tools
  description: >-
    Devices like Polar Loop Gen 2 and Polar Verity Sense can record, store, and share data over Bluetooth Low Energy (BLE).
    This package provides Python and command-line tools for on-device PMD offline recording and local PFTP file retrieval without Polar Flow.
  role: Author and maintainer.
  relationships: [author, maintainer]
  programming_languages: [Python]
  keywords: [Bluetooth Low Energy, BLE, Polar Loop Gen 2, Polar Verity Sense, PMD offline recording, PFTP]
  links:
    - label: GitHub
      kind: repository
      url: https://github.com/zyf0717/polar-ble-tools
    - label: PyPI
      kind: registry
      url: https://pypi.org/project/polar-ble-tools/

- id: coretemp-for-banglejs
  name: CoreTemp for Bangle.js
  description: >-
    A Bangle.js app for CORE and calera sensors, displaying core and skin temperature, heat strain index, and battery status.
    Supports BLE connection management, Recorder integration, and ANT+ heart-rate monitor configuration.
  role: Maintainer.
  relationships: [maintainer]
  programming_languages: [JavaScript]
  keywords: [Bangle.js, CORE sensor, calera sensor, core body temperature, skin temperature, heat strain index, Bluetooth Low Energy, BLE, ANT+, Recorder]
  links:
